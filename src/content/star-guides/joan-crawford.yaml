excerpt: >-
  Born Lucille LeSueur in San Antonio, she remade herself as the immaculate,
  self-made movie star who was never once off duty. From the Beverly Hills
  Hotel to Badrutt's Palace, the Flamingo to the George V, this is the ultimate
  guide to the hotels, restaurants and resorts where Joan Crawford held court —
  many of them still open today.
