name: Frank Sinatra
nickname: Ol' Blue Eyes
birthYear: 1915
deathYear: 1998
portraitImage: /images/stars/frank-sinatra/portrait.jpg
portraitFocus: top
excerpt: >-
  Travel in the footsteps of the Chairman of the Board. From the steakhouses of
  New York to the Las Vegas booth still marked with his brass plaque, this is the
  ultimate guide to the bars, restaurants and hotels where Frank Sinatra ate,
  drank and held court, many of them still open today.
keyDestinations:
  - New York
  - Atlantic City
  - Chicago
  - Las Vegas
  - Los Angeles
  - Palm Springs
  - Miami
  - Havana
  - Monaco
