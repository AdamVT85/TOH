excerpt: >-
  Once heralded as the world's most beautiful woman, Ava Gardner's lust for
  travel, booze and men was legendary. From her birthplace in rural North
  Carolina to the flamenco bars of Madrid and her final years in Knightsbridge,
  this is the ultimate guide to the restaurants, hotels and haunts Ava loved,
  many of them still open today.
