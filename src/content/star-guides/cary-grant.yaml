excerpt: >-
  Follow Cary Grant from a terraced house in Bristol to the backstages of New
  York vaudeville, the poolside of his Hollywood bachelor pad, and the
  sun-drenched corniche roads of the French Riviera. This is the ultimate guide
  to the places that made the man who reinvented himself so completely that even
  he wanted to be Cary Grant.
