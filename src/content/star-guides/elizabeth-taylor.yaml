excerpt: >-
  If you're looking for romance with a hint of old Hollywood sex appeal, ask
  yourself: where would Liz Taylor go? Told through the hotels she scandalised,
  the restaurants she emptied and the cities she set alight with Richard Burton,
  this is the ultimate guide to travelling in the footsteps of Hollywood's most
  famous couple.
