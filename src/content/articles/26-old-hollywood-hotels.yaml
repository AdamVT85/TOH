title: 26 Old Hollywood Hotels You Can Still Book Today
subtitle: >-
  The suites, cocktail bars, and swimming pools where the greatest stars of the
  20th century lived, loved, fought, and occasionally threw furniture — still
  taking reservations.
heroImage: /images/articles/26-old-hollywood-hotels/heroImage.jpg
heroImageFocus: center
heroImageAlt: The Beverly Hills Hotel, the Pink Palace on Sunset Boulevard
heroImageCredit: 'Hero: "The Beverly Hills Hotel (2013)" by Alan Light, CC BY 2.0, via Wikimedia Commons'
excerpt: >-
  26 hotels with genuine old Hollywood pedigree — from the Beverly Hills Hotel to
  Raffles Singapore — still taking reservations, still serving martinis, and
  still trading on golden-age glamour.
