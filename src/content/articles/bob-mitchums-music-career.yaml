title: "Bob Mitchum's Music Career: A Humble Homage to Calypso and Country"
subtitle: >-
  How the only Hollywood tough guy who couldn't give a fuck about his brand
  released a calypso album and a country album, and somehow made both of them
  work.
heroImage: /images/articles/bob-mitchums-music-career/heroImage.jpg
heroImageAlt: Robert Mitchum in close-up against a tropical backdrop of palms and sea
heroImageFocus: top
excerpt: >-
  The unlikely story of how Robert Mitchum, brooding star of Out of the Past and
  The Night of the Hunter, recorded a calypso album and a country album, and
  couldn't give a fuck what anyone thought.
