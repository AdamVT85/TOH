title: "Errol Flynn's Port Antonio: The Hideaway He Built, and Lost"
subtitle: >-
  Hollywood's last great swashbuckler washed up on a storm-battered banana
  port that had just been flattened by a hurricane, fell in love with it
  anyway, and spent his last decade trying to build it into his own private
  kingdom — leaving behind a story of rise and ruin more interesting than any
  of his films.
heroImage: /images/articles/errol-flynn-port-antonio/heroImage.jpg
heroImageAlt: A vintage postcard view of Port Antonio, Jamaica, circa 1908
heroImageCredit: A. Duperly & Sons, Public Domain, via Wikimedia Commons
publishDate: 2026-06-30
excerpt: >-
  In 1946, Errol Flynn's storm-damaged schooner put in at a battered Jamaican
  banana port nobody had heard of. He never really left. The story of what he
  built there — and the bamboo-rafting legend that's grown up around him, on
  a river you can still raft yourself today — is stranger and richer than the
  swashbuckling persona suggests.
