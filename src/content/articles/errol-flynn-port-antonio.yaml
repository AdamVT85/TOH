sections:
  - copy: |-
      By the time Errol Flynn arrived in Port Antonio, the town's best years already looked to be behind it. This was a place that had once shipped more banana boats out of its harbour than Liverpool sent ships across the Atlantic in the same week — a frontier boomtown built almost single-handedly from 1870 onward by a Massachusetts sea captain named Lorenzo Dow Baker, who had stumbled into the banana trade here by accident and turned Port Antonio into the wealthiest port on Jamaica's north coast. Baker built the Titchfield Hotel to house the wealthy Americans who arrived on his banana boats — four hundred rooms and six hundred feet of piazza by the time it was rebuilt in 1905, the grandest address on this stretch of coast. Then came Panama disease, which crept through Jamaica's banana plantations across the 1920s and '30s until the colonial governor himself admitted the crop was doomed. Then, in August 1944, a hurricane tore through Portland parish and wiped out roughly nine-tenths of the parish's banana trees in a single night, flattening buildings across the town along with them.

      It was into this — a faded grand hotel, a beaten harbour, a banana economy on its knees — that Errol Flynn's schooner the Zaca is said to have sailed, blown off course by bad weather. He was, at that point, the most famous swashbuckler alive: Captain Blood, Robin Hood, a decade of Warner Bros. adventure pictures that had made his face one of the most recognisable on earth. He was also, by most accounts, looking for somewhere to disappear to. The storm-blown arrival is one of Port Antonio's most-repeated stories, most often dated to 1946; the most specific surviving record, a period newspaper report, instead documents a "heavy weather" repair stop in Kingston in January 1947, with the Port Antonio leg of the trip undated. The precise mechanics are genuinely uncertain. What isn't is that Flynn turned up sometime in the late 1940s and liked what he found enough to stay, on and off, for the rest of his life — and what he found, crucially, was a town that needed exactly the kind of attention a famous, restless, wealthy man could give it.
  - heading: An Island of His Own
    copy: |-
      Around 1950, Flynn and his third wife, the actress Patrice Wymore, settled in Port Antonio more or less permanently, living for stretches aboard the Zaca, moored off a small island at the mouth of the harbour. That island — 64 acres, called Navy Island, named for an old Royal Navy gun battery once stationed there — became Flynn's. He never built a proper house on it, just a thatched structure wrapped around an existing tree, but he planted a row of royal palms that are said to still stand today, and he entertained there often enough to leave at least one detailed, dated account of an evening on the island. Noël Coward, who lived further along the coast and counted Flynn as a friend, recorded a visit in his diary on 27 March 1951: he had spent the morning rafting down the Rio Grande, then "dined with Errol Flynn and his wife Pat. Drinks on his yacht, which is beautiful, then barbecue dinner on his island — palm trees — lit by torches." The Jamaican saxophonist Andy Hamilton, who led the band at the Titchfield Hotel from around 1946, was reportedly a regular hire for Flynn's parties aboard the Zaca and composed a tune for him in 1948 called "Silvershine."

      Flynn didn't stop at the island. He bought land near Boston Bay further down the coast, acquired a roughly 2,000-acre coconut plantation and cattle ranch, and is widely reported to have bought the old Titchfield Hotel itself, around 1951 — the once-grand banana-boat hotel that had been sitting half-forgotten since the trade collapsed. Press accounts of the time describe him reopening it with a bar of his own, breathing some of its old glamour back into a building that had spent the previous decade in decline; the hotel's grounds went on to host Port Antonio's first marlin-fishing tournament, which still runs most years today. For a few years in the 1950s, it would not have been an exaggeration to say Errol Flynn more or less owned Port Antonio's waterfront — a faded banana boomtown's grandest hotel, its harbour island, and a sizeable stretch of coast besides.
    callout: '"Dined with Errol Flynn and his wife Pat. Drinks on his yacht... then barbecue dinner on his island — palm trees — lit by torches." — Noël Coward, diary, 27 March 1951'
  - heading: The Rafts on the Rio Grande
    image: /images/articles/errol-flynn-port-antonio/sections/1/image.jpg
    imageAlt: A wooden sailing schooner of the kind Errol Flynn owned
    caption: The kind of schooner Flynn called home for much of his time in Jamaica — his own yacht, the Zaca, survives today, restored and based in Monaco
    copy: |-
      Of everything tied to Flynn's name in Port Antonio, the one with the richest second life is also the most mythologised: bamboo rafting on the Rio Grande, the river that winds down out of the Blue Mountains a short drive from town. For generations before Flynn arrived, local farmers had used long bamboo rafts to float bananas downriver to the harbour for export, and recreational raft trips for visitors were already a minor novelty tied to the Titchfield Hotel as early as the turn of the century. Local legend nonetheless credits Flynn — already a world-famous celebrity with Hollywood friends in tow — with turning a working cargo method into the area's signature leisure activity in the 1950s; even Caribbean Beat magazine, which repeats the story, admits it has "more truth than most" Flynn legends rather than calling it settled fact. Whatever its precise origin, the result is real, and it is still running: Rio Grande bamboo rafting remains a genuine, bookable Jamaican tourist experience today, a roughly three-hour pole down the same stretch of river on the same style of raft. Hurricane Melissa tore through Jamaica in October 2025 and destroyed some 140 of the river's bamboo rafts — but as of this writing the operators are rebuilding, and trips are bookable again, which feels like an entirely fitting way for a 1950s Hollywood legend to keep going: battered, slightly mythical, and somehow still afloat.
  - heading: How Much of It Is Still There
    copy: |-
      This is not, in the end, a story with a tidy happy ending. Flynn died in 1959, at fifty, and left his Jamaican holdings to Patrice Wymore. The Titchfield Hotel he had reopened changed hands, and burned down for good in 1969 — the site is now part of a Jamaica Defence Force installation. Navy Island sits today closed to the public and undeveloped, owned by Jamaica's Port Authority, its old resort buildings reportedly standing in ruin, trees growing up through the floorboards. You can look at it from the water. You cannot currently walk it.

      Even the Zaca itself moved on. The schooner survives — restored by an Italian owner and based today in Monaco, sailing the Mediterranean rather than the Caribbean she made famous. Of everything Flynn built or bought in Port Antonio, almost none of it remains in a form a modern visitor can directly experience — with one notable exception, several hours up a jungle river on a raft made of bamboo.
  - heading: What You Can Actually Visit
    copy: |-
      Three things connect present-day Port Antonio to the Flynn years, and they're worth the trip on their own terms. The harbour marina was renamed the Errol Flynn Marina in his honour and operates today as a genuine working facility, with berths and customs services for visiting yachts. Rio Grande bamboo rafting is, as above, a real and current activity, and the closest thing to literally retracing Flynn's own leisure time on the water. And on the cliffs near Navy Island stands the Trident Hotel, a clifftop luxury property that opened during the same years Flynn was based in the area — never his property, and the connection here is one of era rather than ownership, but it draws on exactly the cachet Flynn gave this stretch of coast.

      Port Antonio itself is worth the detour regardless of any Flynn connection — a rougher, quieter, more genuinely Jamaican stretch of coast than the resort towns most travellers know, two hours or so from Ocho Rios and further still from the all-inclusive sprawl of Montego Bay. It was, in its way, Flynn's last and longest-running production: a battered banana town he found half-ruined, built back up by force of personality, and ultimately couldn't hold on to. Most of what's left of it is the view — and a slow ride down a river on a raft that used to carry bananas.
