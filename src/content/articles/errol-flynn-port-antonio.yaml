title: "Errol Flynn's Jamaica"
subtitle: >-
  In 1946, a storm blew Errol Flynn's schooner onto the coast of a forgotten
  Jamaican banana port. He spent the rest of his life trying to hold on to
  it — a love letter to the island that became his last, longest-running
  production, and a guide to following in his footsteps there today.
heroImage: /images/articles/errol-flynn-port-antonio/heroImage.jpg
heroImageAlt: A vintage postcard view of Port Antonio, Jamaica, circa 1908
heroImageCredit: A. Duperly & Sons, Public Domain, via Wikimedia Commons
publishDate: 2026-07-01
excerpt: >-
  Errol Flynn washed up on a battered Jamaican banana port in 1946 and never
  really left. In his own words, and Noël Coward's, and Patrice Wymore's —
  the story of the hotel, the island and the bamboo raft he left behind, and
  how to follow him there today.
