title: Swimming Pools of Classic Hollywood
subtitle: >-
  Discover the most glamourous pools across the globe, that your favourite
  Hollywood stars once took a plunge in... and now you could too!
seriesLabel: 'Part of: The Golden Age of Travel'
heroImage: /images/articles/swimming-pools-of-classic-hollywood/heroImage.jpg
heroImageAlt: The Neptune Pool at Hearst Castle, framed by its Roman temple facade and marble colonnades
heroImageCredit: 'heroImage.jpg — "The Neptune Pool - Hearst Castle (7664221570).jpg" by Alex Proimos (Sydney, Australia), CC BY 2.0, via Wikimedia Commons'
heroImageFocus: center
publishDate: 2025-06-15
excerpt: >-
  From the Neptune Pool at Hearst Castle to the cabanas of the Beverly Hills
  Hotel, discover the iconic swimming pools where Hollywood's elite lounged,
  schemed, and made history.
