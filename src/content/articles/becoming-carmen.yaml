title: "Becoming Carmen: Hollywood, Flamenco, and the Birth of Tourism in Spain"
subtitle: >-
  How a fictional gypsy invented by a Frenchman in 1845 helped save a
  dictatorship, made Hollywood's love goddesses, and turned Spain into the
  world's favourite holiday destination.
heroImage: /images/articles/becoming-carmen/heroImage.jpg
heroImageAlt: Ava Gardner in a traditional flamenco dress at the 1953 Seville Feria
excerpt: >-
  The story of how Carmen, a fictional gypsy, helped save Franco's Spain, shaped
  the careers of Ava Gardner and Rita Hayworth, and turned the country into the
  world's favourite holiday destination.
