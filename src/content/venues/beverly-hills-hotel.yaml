signatureExperiences:
  - name: The Polo Lounge
    description: >-
      The legendary restaurant and bar that remains the power-lunch capital of
      the entertainment industry, though the power has shifted from studio bosses
      to streaming executives. Frank Sinatra and the Rat Pack spent many drunken
      nights here, Ava Gardner was a regular, and Elizabeth Taylor treated it as
      a constant from childhood to old age. Its signature drink is the Polo
      Lounge martini.
    price: Cocktails around $25-30; mains from around $45
  - name: The Bungalows
    description: >-
      The infamous garden bungalows used by screen goddesses Marilyn Monroe,
      Elizabeth Taylor and Marlene Dietrich to conduct their much-gossiped-about
      love affairs. Taylor and Burton's favourite was Bungalow 5; Marilyn used
      Bungalow 7 so often it was renamed "Norma Jean" in her memory.
    price: Bungalows from considerably more than $700 per night
  - name: The Pool (formerly The Sand and Pool Club)
    description: >-
      A truly legendary pool dating back to 1938, when it was known as 'The Sand
      and Pool Club' and surrounded by sand for a beachy vibe. Esther Williams
      had a contract clause granting her a free pass to swim here most mornings;
      Katharine Hepburn allegedly once jumped in fully clothed; the Beatles
      hosted a raucous poolside party. There are now 11 private cabanas, each
      named after an area of Los Angeles and draped in the hotel's signature pink
      and white stripes.
    price: Non-guest day pass currently around $150-200 per person, redeemable against food and drink
    availability: Open year-round
  - name: The Fountain Coffee Room
    description: >-
      The quirky, less formal option, with its vintage banana-leaf wallpaper,
      1940s soda fountain and counter stools. The place for eggs benedict,
      silver-dollar buttermilk pancakes, cold-pressed juice or a classic ice
      cream milkshake.
  - name: The Frank Sinatra Suite
    description: >-
      A suite inspired by the mid-century design Sinatra loved — all simplicity
      and geometric patterns.
