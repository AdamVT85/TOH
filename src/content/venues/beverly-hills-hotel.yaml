sections:
  - heading: The Pink Palace
    copy: >-
      The Beverly Hills Hotel has been the epicentre of Hollywood deal-making and
      heartbreak since it opened on Sunset Boulevard in 1912, three years before
      the first film studio arrived in town. Constructed a stone's throw from
      Mary Pickford and Douglas Fairbanks' legendary Pickfair estate, the hotel
      has a Hollywood pedigree like no other.

      Its banana-leaf wallpaper is one of the most recognised interiors in the
      world, and its bungalows have hosted more affairs, breakdowns, and
      career-defining conversations than any other address in California.
      Valentino, Swanson, Chaplin and Keaton were all pleasure-seeking regulars.
      Howard Hughes lived here on and off for thirty years, sometimes renting
      multiple bungalows at once and having roast beef sandwiches delivered at
      3am.
    callout: Constructed a stone's throw from Mary Pickford and Douglas Fairbanks' legendary Pickfair estate.
  - heading: The Polo Lounge and the bungalows
    copy: >-
      The Polo Lounge remains the power-lunch capital of the entertainment
      industry, though the power has shifted from studio bosses to streaming
      executives. Frank Sinatra and the Rat Pack spent many drunken nights here;
      Ava Gardner was a regular; and the Polo Lounge was a constant in Elizabeth
      Taylor's life from childhood to old age — the hotel even immortalised her
      with a signature cocktail, the "Violet Eyes."

      The infamous bungalows were used by screen goddesses Marilyn Monroe,
      Elizabeth Taylor and Marlene Dietrich to conduct their much-gossiped-about
      love affairs. Taylor and Burton's favourite was Bungalow 5, while it was
      lucky number 7 for Marilyn — this bungalow is now named "Norma Jean" in her
      memory. Elizabeth Taylor honeymooned at the hotel six of her eight times, a
      statistic that tells you everything you need to know about Elizabeth
      Taylor.
  - heading: A legendary pool
    copy: >-
      The pool dates back to 1938, when it was known to guests as 'The Sand and
      Pool Club,' surrounded by sand to give it a beachy vibe. Esther Williams,
      the great aquatic saviour of MGM in the late 1940s, had a clause written
      into her studio contract that gave her a free pass to the pool, where she'd
      swim most mornings before work. Katharine Hepburn allegedly once jumped in
      fully clothed, while the Beatles hosted a raucous poolside party amongst
      the luxury cabanas.

      The pool has generated more than a few iconic images over the years. Faye
      Dunaway's legendary poolside photograph — taken by her future husband Terry
      O'Neill the morning after she won Best Actress for Network in 1977 — was
      described by the photographer as "one of the most Hollywood pictures of all
      time." Nowadays there are 11 private cabanas, each named after an area of
      Los Angeles and draped in the hotel's signature pink and white stripes.
    callout: Swimmers may be surprised to hear music playing underwater.
