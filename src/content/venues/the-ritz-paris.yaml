sections:
  - copy: >-
      The Ritz on Place Vendôme is not so much a hotel as a monument to
      20th-century glamour. Coco Chanel lived here for over 30 years, occupying
      a suite on the Rue Cambon side until her death in 1971. Marlene Dietrich
      was a regular between the wars. Garbo checked in under assumed names. F.
      Scott Fitzgerald drank here, of course he did.

      But the hotel's greatest Hollywood story belongs to Ernest Hemingway, who
      during the liberation of Paris in 1944 arrived at the Ritz with a group of
      resistance fighters and "liberated" the bar. The bar is now named after
      him, and a plaque marks the occasion. The fact that the Germans had
      already left the hotel before Hemingway arrived has never been allowed to
      diminish the legend.
    callout: Hemingway's "liberation" of the Ritz bar in 1944 remains the hotel's greatest Hollywood story.
  - heading: The Bar Hemingway
    copy: >-
      The Bar Hemingway is small, wood-panelled, and decorated with photographs
      of Papa. The cocktails are superb and superbly priced.

      The hotel was closed for a four-year renovation (2012–2016) and has
      emerged even more pristine than before, which is the Ritz equivalent of a
      very expensive facelift that nobody is supposed to mention.
