      The indoor pool occupies the entire east wing beneath a vaulted 1920s
      ceiling, framed by Moorish arches, hand-painted ceramic tiles, and
      classical columns. Hotel guests can have it almost to themselves in the
      morning; non-swimmers can admire it from the observation deck above.
