sections:
  - heading: The headquarters of the Cannes Film Festival
    copy: >-
      The belle epoque palace dominating La Croisette is the hotel that Alfred
      Hitchcock used as the centrepiece of To Catch a Thief, and it has been the
      unofficial headquarters of the Cannes Film Festival since the festival
      began in 1946. Grace Kelly's character, Frances Stevens, stays here in the
      film, and Cary Grant's John Robie arrives at the hotel's private beach
      after escaping by boat.

      During festival season every May, the hotel becomes the most exclusive
      address on the coast — essentially the most glamorous office building in
      the world, with every suite occupied by a studio executive, a producer, or
      someone pretending to be one.
    callout: The most famous hotel on the Croisette, and the traditional headquarters of the festival held every May.
  - heading: Where a princess was made
    copy: >-
      It was here, during the 1955 festival, that Grace Kelly met Prince Rainier
      III of Monaco for the first time. She married him the following year,
      ended her film career, and began the Monaco fairy tale. She never made
      another film.

      The coincidence has haunted To Catch a Thief ever since: Kelly, who was
      not a confident driver, did her own driving for the white-knuckle scene on
      the Grande Corniche above the coast. She died in 1982 from injuries
      suffered in a car crash on a similarly winding Riviera road.
