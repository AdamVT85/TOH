sections:
  - heading: A palazzo on the Grand Canal
    copy: >-
      The Gritti Palace is the most unlikely kind of hotel: a 15th-century
      palazzo on the Grand Canal that has been receiving illustrious guests since
      the Doge's day, though its Hollywood credentials were cemented in the 20th
      century. The building takes its name from Doge Andrea Gritti, and it began
      taking paying guests in the 19th century before becoming a hotel in 1895.

      The Venice Film Festival, held on the nearby Lido every September, has
      ensured a steady stream of film stars through the lobby since 1932 —
      generation after generation of festival attendees passing through the same
      gilded rooms.
  - heading: Hemingway's writing table
    copy: >-
      Ernest Hemingway wrote Across the River and into the Trees here, working at
      a corner table overlooking the water with a bottle of Valpolicella for
      company. Greta Garbo stayed in her usual fashion: anonymously,
      unsuccessfully, and with great irritation at anyone who recognised her.

      Bogart, Chaplin and Elizabeth Taylor were among the other names who passed
      through, joining the festival crowd that has made the Gritti a fixture of
      cinematic Venice.
    callout: >-
