sections:
  - copy: >-
      This magnificent downtown hotel opened in October 1923 as the largest
      hotel west of Chicago, and within a few years it had wired itself
      permanently into the story of the movies. More than three thousand of Los
      Angeles's great and good turned out for the opening — Jack Warner, Cecil B.
      DeMille, and Mary Pickford among them — and the Renaissance Revival
      interiors, with their hand-painted ceilings, have been a stand-in for
      old-world glamour ever since.
  - heading: Birthplace of the Oscars
    copy: >-
      In 1927, the Academy of Motion Picture Arts and Sciences was founded at a
      gathering in the hotel's Crystal Ballroom, and Hollywood lore insists that
      MGM's great production designer Cedric Gibbons sketched the very first
      Oscar statuette on a Biltmore dinner napkin. True or not, the hotel went on
      to host the Academy Awards eight times between 1931 and 1942 — back when
      the ceremony was an intimate $10-a-plate dinner rather than the four-hour
      endurance test it has since become.
    callout: The moniker "Oscar" was born here, complete with a giant neon statuette on the hotel's facade.
  - heading: A star of the screen in its own right
    copy: >-
      The Biltmore's ornate interiors have appeared in dozens of films and
      television shows — Chinatown, The Bodyguard, Ghostbusters, Mad Men —
      whenever a director needed a room that looked expensive without trying too
      hard. The lobby alone is worth the detour even if you never make it
      upstairs.
