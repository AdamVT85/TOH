  The grande dame of downtown Los Angeles, where the Academy of Motion Picture
  Arts and Sciences was born and the first Oscar statuette was reportedly
  sketched on a dinner napkin. Its gilded ballrooms hosted the Academy Awards
  eight times and have since starred in everything from Chinatown to Ghostbusters.
