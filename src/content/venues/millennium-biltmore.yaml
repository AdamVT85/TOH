bestTimeToVisit: Year-round. Weekdays are quietest for admiring the public rooms.
tips: >-
  The lobby is free to admire — ask whether the Crystal Ballroom, where the
  early Oscars were held, can be viewed during your visit. A darker footnote:
  this was the last place the Black Dahlia, Elizabeth Short, was seen alive in
  1947, a detail the Biltmore understandably keeps quiet.
howToBook: >-
  Book rooms direct at <a
  href="https://www.millenniumhotels.com/en/los-angeles/the-biltmore-los-angeles/"
  target="_blank" rel="noopener">millenniumhotels.com</a> or by phone. No ticket
  is needed to admire the lobby and Rendezvous Court — just walk in; ask the
  front desk about viewing the Crystal Ballroom.
accessibilityNotes: >-
  Contact the hotel directly to confirm accessible rooms and step-free access to
  the historic public rooms.
