  - name: The Rendezvous Court (original lobby)
    description: >-
      The hotel's original main lobby, now the Rendezvous Court, has a
      Moorish-Revival ceiling finished in 24-carat gold and two Italian
      chandeliers imported in 1923. Free to admire even if you are not staying.
  - name: The Crystal Ballroom
