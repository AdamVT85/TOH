sections:
  - heading: The actor who built a club at the foot of a mountain
    copy: >-
      The Fairmont Mount Kenya Safari Club in Nanyuki has been a magnet for
      royalty, millionaires and stars since its opening in 1959. It was founded
      by actor William Holden, who fell in love with the land during a hunting
      safari and bought the property with two partners.

      The club sits on 120 acres in the foothills of Mount Kenya, straddling the
      equator, with 120 guest rooms and an animal orphanage next door that is
      home to the only bongo breeding area in Africa, plus a large turtle named
      Speedy Gonzales who is reportedly more than 150 years old. The Fairmont
      group took over several years ago and refurbished the entire property,
      including the main building — a wonderful example of 1950s colonial
      architecture — while maintaining its historical polish.
    callout: >-
      A colonial-era safari lodge run by a Hollywood actor who decided he'd
      rather live among elephants than studio executives. Given the choice, most
      people would agree with him.
  - heading: Royalty, the Rat Pack and a wall of famous faces
    copy: >-
      The club is no stranger to royalty, prominent politicians and Hollywood
      stars. Winston Churchill enjoyed smoking his cigar in the lavish dining
      room with his afternoon tea. Over the years its guests have included Ernest
      Hemingway, Clark Gable, the Rat Pack, Steve McQueen and Charlie Chaplin.
      The Trophy Lounge is filled with starry images of past visitors, including
      Grace Kelly, Ava Gardner, John Wayne and Marlon Brando.

      A glance at the sponsor wall still shows the names "Mr/Mrs Frank Sinatra"
      and "Mr/Ms Paul Newman" among the donors. Sinatra stayed here when he came
      to visit his wife, Ava Gardner.
  - heading: The Mogambo base camp
    copy: >-
      The club has a particular place in the story of John Ford's Mogambo
      (1953), in which Clark Gable is torn between Grace Kelly and Ava Gardner.
      Much of the action was filmed in the wilds of Kenya and Uganda, with the
      cast and crew setting up camp near the Kagera River and then close to the
      Uaso Nyiro River.

      The Mogambo cast and crew — Gable, Gardner and Kelly among them — were
      known to visit the Mount Kenya Safari Club for drinks and entertainment
      during filming. Ava herself visited during the 1953 shoot. If you have
      never thought about going on safari before, you may well after watching the
      film.
