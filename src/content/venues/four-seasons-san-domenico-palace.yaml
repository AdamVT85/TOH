sections:
  - copy: >-
      Perched on the cliffs above the Ionian Sea in one of Sicily's most
      spectacular towns, the San Domenico Palace began life as a 15th-century
      Dominican convent before being transformed into a hotel in 1896. The views
      from its terrace, across to Mount Etna and down the coastline, are among
      the most spectacular of any hotel in Europe.

      Elizabeth Taylor, who had seen her share of hotel views, reportedly said it
      was one of the most beautiful places she had ever stayed. Over the years it
      drew a glittering cast of guests — Taylor and Burton, Garbo, Dietrich,
      Loren — to its convent rooms and bougainvillea-draped gardens.
  - heading: Taylor, Burton and the mandolin
    copy: >-
      Taylor and Burton made the San Domenico Palace their Sicilian base, and the
      hotel duly witnessed one of the more colourful episodes of their famously
      volatile marriage. Taylor reportedly smashed a mandolin over Burton's head
      on the terrace during a row in 1967 — which gives some indication of the
      kind of stay they had.

      Local legend tells it slightly differently: that a fellow guest once asked
      Burton to play the mandolin more quietly, and Burton smashed the instrument
      over the man's head instead. Either way, the mandolin did not survive.
    callout: >-
      Taylor reportedly smashed a mandolin over Burton's head on the terrace
      during a row in 1967.
  - heading: A second act, courtesy of The White Lotus
    copy: >-
      The hotel underwent a spectacular transformation and reopened in 2022 as
      the Four Seasons at San Domenico Palace. It became globally famous all over
      again as the setting for Season 2 of HBO's The White Lotus, which has had a
      profound effect on tourism in Taormina.

      Bookings surged, the town appeared on every travel list in the world, and
      the hotel now restricts non-guest access to its bars and restaurants during
      peak periods. The good news is that Taormina — with its ancient Greek
      theatre, medieval streets, and views of Etna — more than lives up to the
      hype.
