sections:
  - image: /images/venues/chateau-marmont/sections/0/image.jpg
    caption: >-
      The Sunset Strip in the early 1930s. The Garden of Allah can be seen on
      the left and the Chateau Marmont further down on the right.
    copy: >-
      Perched somewhat menacingly above Sunset Boulevard, the Chateau Marmont
      has been quietly absorbing Hollywood's worst behaviour since 1929. It was
      built to look like the Château d'Amboise in the Loire Valley and
      engineered to survive earthquakes, which, given some of the explosive
      goings on behind closed doors at the hotel, was prescient.


      When it first opened, the Sunset Strip was the engine room of Hollywood
      nightlife. The Trocadero was a stagger away. The Garden of Allah, that
      scandalous compound of bungalows where Sinatra and Fitzgerald and the
      Algonquin set drank themselves stupid, was directly across Sunset.
      Schwab's Drug Store, where every starlet swore she had been discovered at
      the soda counter, sat a block down. Into this dense little ecosystem of
      vice, the Chateau dropped itself as the after-hours alternative. The
      Trocadero closed at two. The Chateau did not.


      The hotel took off in the early 1930s when Ann Little, an ex-silent-film
      actress with serious style and a serious address book, took over as
      manager. She remodelled, bought new furniture, and started inviting her
      famous friends. Within a few years, the Chateau was THE place to party in
      private. Harry Cohn, the head of Columbia Pictures, kept suites on
      permanent retainer specifically so his stars could misbehave in private.
    callout: '"If you must get into trouble, do it at the Chateau Marmont." - Harry Cohn'
  - heading: A Guest List Like No Other
    image: /images/venues/chateau-marmont/sections/1/image.webp
    caption: >-
      Jean Harlow, her husband Harold Rosson and her parents at the Chateau
      Marmont in 1933.
    copy: >-
      Greta Garbo lived here for stretches under the alias Harriet Brown and
      reportedly spoke to no one. Howard Hughes took a higher-floor suite
      specifically so he could watch the pool through binoculars; when he was
      not doing that, he was working through what staff remembered as a truly
      heroic standing order of ice cream from the kitchen. Jean Harlow moved in
      with her new husband, the cinematographer Harold Rosson, in September 1933
      on the principle that one suite would not be enough. They took two. Jean
      redecorated hers in white-on-white, and the staff began to notice a steady
      traffic of gentleman callers in and out of her rooms while her new
      husband, when he was in residence, slept on the sofa in the living room.
      When the marriage collapsed a few months later, the news that they had
      "moved out of the Chateau Marmont" became the sentence that put the hotel
      on the front pages of every newspaper in America. The Chateau has not had
      to advertise since.


      Billy Wilder lived at the hotel in the early 1940s, and legend has it that
      the seedy bachelor apartment Walter Neff occupies in Double Indemnity,
      which Wilder co-wrote at the Chateau, is more or less his own Chateau
      lodgings transposed wholesale to the screen. James Dean once leapt through
      a window during an audition in one of the suites, won the lead in Rebel
      Without a Cause on the strength of it, and gave Hollywood a new monologue.
      Montgomery Clift convalesced at the Chateau after his catastrophic 1956
      car crash, hiding from the press while his face was being reconstructed.
      Desi Arnaz fled here after almost every one of his famously frequent rows
      with Lucy. Shelley Winters and her second husband, the actor Anthony
      Franciosa, were such reliably enthusiastic guests in the late 1950s that
      Winters later delivered the verdict below.
    callout: |
      "If there had been an Olympic sex team, Tony would have been the captain."
      — Shelley Winters, on her husband Anthony Franciosa, both Chateau regulars
  - heading: The Last One Standing
    copy: >-
      What makes the Chateau essential for the Old Hollywood traveller is not
      its past but its persistence. The Trocadero, the Garden of Allah, the
      Brown Derby, Schwab's: all gone. The Chateau is still here, still dark in
      the lobby, still overfurnished, still serving the old-school cocktails for
      which the bar has always been famous, still threaded with bougainvillea
      that has been keeping Hollywood's secrets for nearly a hundred years.


      In 2020, the hotel converted to a members-only model under the continued
      ownership of Andre Balazs. For visiting pilgrims, the way in is to book a
      room; not cheap, but the cost buys access to one of the last working
      monuments of Hollywood's Golden Age. Sleep where Garbo slept. Sit where
      Wilder wrote. Order the ice cream, and quietly toast Howard Hughes.
