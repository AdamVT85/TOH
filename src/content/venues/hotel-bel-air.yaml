sections:
  - copy: >-
      Opened in 1946 and set in twelve acres of lush gardens in Stone Canyon,
      the Hotel Bel-Air was the hotel of choice for stars who wanted privacy
      rather than publicity — the very opposite of the Beverly Hills Hotel's
      see-and-be-seen Polo Lounge. Grace Kelly, Cary Grant, and Gary Cooper were
      regulars, and the hotel has maintained its secluded, garden-party
      atmosphere ever since.

      Swan Lake, complete with actual swans, is one of the most peaceful spots in
      Los Angeles, which is saying something for a city that rarely sits still.
  - heading: Discretion as a design principle
    copy: >-
      Where other hotels traded on being seen, the Bel-Air built its reputation
      on the opposite. Hidden away behind the gardens of Stone Canyon, it offered
      the quieter kind of old Hollywood glamour — the sort that did not need a
      photographer to confirm it had happened.

      Unlike the Beverly Hills Hotel (see and be seen) or the Chateau Marmont
      (see, be seen, and regret it in the morning), the Bel-Air kept its
      cachet by keeping its guests to itself.
    callout: Discretion as a design principle.
