sections:
  - copy: >-
      Claridge's, the art deco grande dame of Mayfair, has been hosting
      Hollywood visitors since the talkies era. Its combination of supreme
      discretion and impeccable service made it the obvious choice for stars who
      wanted privacy without sacrificing luxury — and the obvious choice it has
      remained.

      The hotel's discretion policy means specific rooms are not publicised,
      which is rather the point. You came to Claridge's precisely because nobody
      would tell anyone you were there.
  - heading: Cary Grant's London
    copy: >-
      Cary Grant's London connections were surprisingly thin for a man who was
      born English. Bristol was home, Hollywood was work, and London was
      somewhere in between. But when he was in the capital, Claridge's was his
      hotel of choice, and he stayed here on visits to the UK throughout his
      career.

      The hotel bar still has the kind of hushed, wood-panelled atmosphere where
      you can imagine Grant ordering a very dry martini and making it look like
      the most natural thing in the world.
    callout: >-
      Claridge's, the art deco grande dame in Mayfair, was Grant's London hotel
      of choice.
  - heading: Ava Gardner and the Pandora press
    copy: >-
      Ava Gardner was a regular at Claridge's during her years living a short
      hop away in Knightsbridge. She and the rest of the cast of Pandora and the
      Flying Dutchman were put up here during filming, and she hosted a press
      conference in the hotel's Banquet Room.

      She was in good company: Spencer Tracy and Katharine Hepburn maintained a
      discreet suite arrangement, and the guest book over the years has taken in
      Elizabeth Taylor, Marlene Dietrich, and Audrey Hepburn. Still one of
      London's finest hotels.
