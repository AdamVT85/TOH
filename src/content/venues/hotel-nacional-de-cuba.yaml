signatureExperiences:
  - name: The outdoor pools
    description: >-
      Two outdoor pools surrounded by palm trees, with a poolside restaurant for
      lunch and a drinks service throughout the day. This is the pool Johnny
      Weissmuller reportedly impressed the staff with by jumping into from a
      second-floor window — the minimum expected, perhaps, from a man who played
      Tarzan for a living.
  - name: Cabaret Parisien
    description: >-
      The on-site cabaret hosts nightly music and dance shows.
    availability: Nightly
  - name: Free guided tours of the grounds
    description: >-
      The hotel runs free guided tours of the grounds and its old military
      fortifications, taking you past the antique cannons of the Santa Clara
      Battery, now part of a UNESCO World Heritage Site.
    availability: Monday to Friday 10am and 4pm; Saturday 10am
  - name: The Film Corner snack bar
    description: >-
      A gloriously low-key tribute to the hotel's past, the Film Corner snack
      bar features a gallery of old Hollywood star portraits.
  - name: The terrace
    description: >-
      The hotel's famous terrace has arguably the best sunset views in Havana.
