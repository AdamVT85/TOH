signatureExperiences:
  - name: The Tropicana Pool
    description: >-
      The pool opened in 1950 as part of a $1 million "Promenade" tropical resort
      redesign, with a grand opening on 16 June at which airline hostesses
      ceremonially poured water samples from every ocean in the world into it. It
      still has the famous David Hockney mural painted on its bottom.
  - name: The Marilyn Monroe Suite
    description: >-
      A suite with a wraparound balcony overlooking the Tropicana Pool, named for
      the star who lived at the hotel for two years while her modelling career was
      taking off. Exclusive to hotel guests.
  - name: The Spare Room
    description: >-
      A cocktail lounge inside the hotel with a twist: two vintage bowling lanes
      from the 1930s sit in the middle of the room. Order a classic cocktail, bowl
      a frame, and contemplate the fact that Clark Gable and Carole Lombard were
      conducting their affair upstairs while you roll.
    price: Cocktails from around $18; bowling from $10 per person
  - name: The Blossom Room
    description: >-
      The room that hosted the first ever Academy Awards ceremony on 16 May 1929
      — a fifteen-minute affair, nothing like the four-hour endurance test the
      Oscars have since become.
