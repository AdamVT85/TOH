sections:
  - heading: The headquarters of early Hollywood
    copy: >-
      This iconic hotel opened in 1927, financed by some of the biggest names in
      the business: Mary Pickford, Douglas Fairbanks, Sid Grauman and Louis B.
      Mayer. The guest list at the grand opening read like a roll-call of the era
      — Chaplin, Swanson, Garbo, Clara Bow — and the Roosevelt quickly became the
      headquarters of early Hollywood glamour.

      Charlie Chaplin, H.G. Wells, Clark Gable and Carole Lombard were all
      regulars. Errol Flynn was a frequent guest too, though one suspects the
      Roosevelt's management preferred not to ask too many questions about what
      Flynn got up to on the premises.
    callout: >-
      Clark Gable and Carole Lombard carried on their infamous affair in the
      penthouse, which cost $5 a night.
  - heading: The first Academy Awards
    copy: >-
      The very first Academy Awards ceremony was held in the hotel's Blossom Room
      on 16 May 1929, and the Roosevelt has been trading on that distinction ever
      since. It was a fifteen-minute ceremony — nothing like the four-hour
      endurance test the Oscars have become.
  - heading: Marilyn, the pool and a Hockney
    copy: >-
      Marilyn Monroe lived at the hotel for two years while she was a struggling
      model, and did her first commercial photo shoot by the pool. She is said to
      haunt the corridors to this day.

      The Tropicana Pool itself opened in 1950 as part of a $1 million
      "Promenade" tropical resort redesign. The grand opening on 16 June was an
      exercise in amusing Hollywood absurdity: airline hostesses ceremonially
      poured water samples from every ocean in the world into the pool. Today the
      pool is a David Hockney painting come to life — literally, Hockney painted
      the bottom of it — and you can stay in the Marilyn Monroe Suite, with its
      wraparound balcony overlooking the water.
  - heading: A martini and a frame
    copy: >-
      For a nightcap, the Spare Room cocktail bar has two vintage 1930s bowling
      lanes if you fancy rolling a frame after your martini, in a room that looks
      as though it was designed for William Powell and Myrna Loy.
