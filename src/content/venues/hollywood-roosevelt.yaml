howToBook: >-
  Book direct at <a href="https://www.thehollywoodroosevelt.com/"
  target="_blank" rel="noopener">thehollywoodroosevelt.com</a> or by phone. The
  Marilyn Monroe Suite is exclusive to hotel guests; the Spare Room cocktail bar
  and bowling lanes are open to visitors.
nearestAirport: LAX — approx. 30–40 minutes by car
transportNotes: >-
  In the heart of Hollywood on Hollywood Boulevard, opposite the TCL Chinese
  Theatre and beside the Dolby Theatre. The Hollywood/Highland Metro B (Red) Line
  station is a short walk away.
bestTimeToVisit: >-
  Year-round. Tuesdays and Thursdays tend to be the cheapest nights for rooms.
accessibilityNotes: >-
  Contact the hotel directly to confirm accessible rooms and step-free access to
  the pool, bars and historic public rooms.
tips: >-
  A word of warning for light sleepers: the hotel runs poolside live music on
  weekends and has hosted pool parties on Sundays through the summer months.
  Marilyn Monroe is said to haunt the corridors, along with the ghost of 1950s
  idol Montgomery Clift, with sightings of both regularly reported by guests.
