  - name: The piano-shaped pool
    description: >-
      The estate's most photographed feature, a swimming pool shaped
      unmistakably like a grand piano. According to architect E. Stewart
      Williams the shape was entirely accidental rather than a deliberate tribute
      to Frank's musicianship, though nobody has ever quite believed him.
  - name: Sinatra's original recording studio
    description: >-
      The property still contains Sinatra's original recording studio, preserved
      as a relic of musical history. It remains in place but is not connected for
      use, which is probably for the best.
    availability: Not available for use
