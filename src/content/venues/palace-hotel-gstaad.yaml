sections:
  - heading: The Burtons' Swiss base
    copy: >-
      Richard Burton described Gstaad as "the most beautiful place in the
      world," and the chic resort town in the Swiss Alps has long drawn the rich
      and famous — from Julie Andrews and Roger Moore to the Aga Khan and
      Brigitte Bardot. Elizabeth Taylor bought Chalet Ariel, her longtime Gstaad
      home, while still married to Eddie Fisher, and it became her and Richard's
      base whenever they were in Europe, the place they spent every Christmas
      and New Year entertaining friends and family.

      The chalet could only hold so many, however, and so the overflow was sent
      down the road to the opulent Gstaad Palace — at Taylor's expense. The
      couple would arrive with an entourage, several dogs, and, as the legend
      goes, enough luggage to fill a small cargo plane.
    callout: >-
      Burton wrote of Chalet Ariel's library: "It is a fantastic reference
      library with the index in my head. I shall browse in that place for the
      rest of my life."
  - heading: A fairytale palace above the village
    copy: >-
      The Palace is a turreted, fairytale-like building overlooking the village,
      and it has been the winter headquarters of international high society since
      the 1950s. It is one of the grand palaces of the Swiss Alps, the kind of
      address that comes alive in the snow.

      Julie Andrews, Roger Moore, Sophia Loren, and a rotating cast of European
      royalty number among its famous guests. Downstairs, the nightclub GreenGo
      has been hosting après-ski revelry since the 1970s — proof that the
      glamour here does not stop when the lifts do.
