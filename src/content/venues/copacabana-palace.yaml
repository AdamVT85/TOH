sections:
  - copy: >-
      Opened in 1923 overlooking Copacabana Beach, this Belmond property has been
      Rio's most famous address for a century and remains the most celebrated
      hotel in South America. It is the natural setting for any film involving
      romance, intrigue, and tropical grandeur, and it has kept its original
      1920s character while quietly adding modern comforts.

      The hotel's art deco pool is one of the most photographed in the world, and
      the view from the sea-facing rooms, across Copacabana Beach to Sugarloaf
      Mountain, is one of the great hotel views anywhere.
  - heading: The balcony kiss in Notorious
    copy: >-
      The Copacabana Palace is where Hitchcock set one of the most famous moments
      in Cary Grant and Ingrid Bergman's careers: the censor-defying, 60-second
      screen kiss in Notorious (1946), played out on a hotel balcony overlooking
      Copacabana Beach.

      While most of the film's action was shot on RKO sound stages, the
      establishing shots of Rio and that balcony scene make the Copacabana Palace
      forever part of the picture. It's still there, still grand, and still the
      place to stay if you want to channel Grant and Bergman.
    callout: The setting for the balcony kiss in Notorious (1946), and the art deco pool.
  - heading: Glamour and self-reinvention
    copy: >-
      The hotel also captures the spirit of Now Voyager (1942), Bette Davis's
      great tale of glamorous self-reinvention, whose love story plays out on the
      streets of Rio and around Sugarloaf Mountain. The kind of old-world
      grandeur on offer here is exactly what the Boston-bound heroine would have
      adored.

      Ava Gardner stayed while promoting The Barefoot Contessa during a 1950s
      publicity tour of South America. Orson Welles, Marlene Dietrich, and
      Princess Diana have all stayed too. The hotel's New Year's Eve gala remains
      one of Rio's most exclusive events.
