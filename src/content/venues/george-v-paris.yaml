sections:
  - copy: >-
      The most opulent hotel in Paris and a favourite of Hollywood royalty since
      it opened in 1928, the George V — now run by Four Seasons — represents, for
      old Hollywood fans, the pinnacle of European hotel luxury. It is the kind
      of place where a star could disappear for a week and emerge looking ten
      years younger and €50,000 poorer.

      The flower arrangements in the lobby cost a rumoured €40,000 per week,
      which tells you everything you need to know about the hotel's approach to
      understatement.
    callout: The flower arrangements in the lobby cost a rumoured €40,000 per week.
  - heading: Ava's Paris hotel of choice
    copy: >-
      Ava Gardner stayed at the George V while on a break from filming Pandora
      and the Flying Dutchman in 1951. Frank Sinatra flew out to see her, and the
      pair dined at the much-storied Tour d'Argent, the restaurant that has been
      serving diners overlooking Notre-Dame since 1582.

      Elizabeth Taylor and Richard Burton later occupied suites here during their
      European years — Taylor making the George V her Parisian base. Marlene
      Dietrich, Orson Welles and the Beatles all passed through too.
  - heading: Le Cinq and the courtyard
    copy: >-
      The hotel's restaurant, Le Cinq, holds two Michelin stars and is a serious
      dining destination in its own right. The interior courtyard garden,
      meanwhile, is one of the most tranquil spaces in the city — a rare pocket
      of calm just steps from the Champs-Elysees.
