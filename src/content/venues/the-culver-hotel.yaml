sections:
  - copy: >-
      This gorgeous 1924 landmark in the heart of Culver City has one of the
      best old Hollywood stories of any hotel in Los Angeles. Beautifully
      restored and now operating as a boutique property, it stands a stone's
      throw from the Sony lot — formerly MGM — where Ava Gardner, Elizabeth
      Taylor, Judy Garland, Gene Kelly, and Clark Gable all worked.

      Its proximity to the old MGM studio is no accident. When the cameras
      needed somewhere to put up their cast and crew, the Culver was right next
      door, and that closeness wired the hotel permanently into the story of the
      movies.
  - heading: The Munchkins of Oz
    copy: >-
      The hotel's most famous tale belongs to 1938, when the Munchkin actors
      from The Wizard of Oz were housed here during filming at the adjacent MGM
      lot. Their legendary off-duty behaviour — drinking, fighting, and general
      mayhem that would have alarmed Dorothy — has been embellished over the
      decades into one of Hollywood's most enduring backstage myths.

      Whether the stories are true or exaggerated, the hotel's Oz connection is
      genuine, and it remains the headline reason film fans make the
      pilgrimage to Culver City.
    callout: >-
      Whether the stories are true or exaggerated, the hotel's Oz connection is
      genuine.
