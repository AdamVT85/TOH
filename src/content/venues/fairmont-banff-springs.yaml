sections:
  - heading: The cast and crew's hotel of choice
    copy: >-
      During the 1953 filming of Otto Preminger's first Western, River of No
      Return, the Banff Springs Hotel was the cast and crew's accommodation of
      choice — a historic, castle-like railway hotel set in the heart of the
      Canadian Rockies, and still going strong today.

      The province's drinking laws at the time meant that the hotel was the only
      place for miles that had any booze, so Robert Mitchum could be found
      propping up the hotel bar most nights. Marilyn Monroe also spent time here
      with Joe DiMaggio while she recovered from a leg injury she sustained
      during filming.
    callout: >-
      The bar where Mitchum drank during River of No Return. Mountain views
      unchanged since the 1950s.
  - heading: Experience it in person
    copy: >-
      The Fairmont Banff Springs is one of the most iconic hotels in North
      America, a castle-like railway hotel set in the heart of Banff National
      Park. It looks virtually unchanged from Monroe and Mitchum's day, though
      the amenities have improved somewhat — there are now multiple restaurants,
      a world-class spa, a bowling alley, and a golf course consistently ranked
      among the top ten in Canada.

      The Bow River, Lake Louise, and the surrounding mountain scenery that
      feature in the film are all within easy reach and remain some of the most
      spectacular landscapes in the world.
