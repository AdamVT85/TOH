sections:
  - heading: From monastery to movie-star magnet
    copy: >-
      The Splendido rose from the ashes of a former 16th-century monastery to
      become one of the world's most celebrated hotels. The building was bought in
      1901 and reopened as a hotel in 1902, and by the middle of the century it had
      become the place Hollywood went when it wanted the Italian Riviera at its
      most glamorous.

      It played host to Clark Gable, Humphrey Bogart, Lauren Bacall, Ava Gardner,
      Elizabeth Taylor and Richard Burton. Charlie Chaplin was a regular. Grace
      Kelly adored the place. Maria Callas came here to be dramatic in more
      beautiful surroundings than La Scala could offer. And Frank Sinatra liked
      Portofino so much there's a lookout point on Mount Portofino named after him,
      which feels about right for a man who expected the landscape itself to pay
      tribute.
    callout: >-
      A heated saltwater pool, lush gardens, bright orange umbrellas, and that
      terracotta-and-azure colour palette — you half expect to see Bogart slouched
      in a deckchair while Bacall pretends not to notice him from behind enormous
      sunglasses.
  - heading: The Barefoot Contessa and a wisteria-clad proposal
    copy: >-
      Bogie, Bacall and Ava Gardner stayed here during filming for The Barefoot
      Contessa, the whimsical, over-the-top drama in which Gardner plays a flamenco
      dancer propelled towards stardom. Gardner fell in love with Portofino and
      returned often on private holidays; the Splendido was her hotel of choice.

      Taylor and Burton, meanwhile, used the hotel as an escape from the paparazzi
      during the height of their much-publicised affair, arriving on the yacht
      Kalizma and returning many times afterwards. It's rumoured that Burton
      proposed to Elizabeth on the wisteria-clad terrace — and if you're going to
      propose anywhere, a wisteria-clad terrace overlooking Portofino harbour is a
      fairly solid choice.
  - heading: Still splendid
    copy: >-
      The hotel was renovated in 2025 but has kept its character firmly intact, and
      it now holds two Michelin keys. La Terrazza, the main restaurant, serves a
      spaghetti dish called "Homage to Elizabeth Taylor." The sister property,
      Splendido Mare, down by the harbour, even has a suite named after Ava Gardner,
      complete with a sprawling waterfront terrace and lemon trees, which feels
      entirely appropriate.

      This is not a budget swim. Rooms at the Splendido now start above $2,000 per
      night in high season, which is rather the point — it is, as the stars who came
      here would tell you, the luxury end of the Riviera. The hotel is seasonal, so
      book well in advance.
