  A former 16th-century monastery turned ultra-luxury hotel on the hillside above
  Portofino harbour, the Splendido has been the default destination for Hollywood
  royalty visiting the Italian Riviera since the 1950s. Bogart and Bacall, Ava
  Gardner, Elizabeth Taylor and Richard Burton, Clark Gable, Grace Kelly and Frank
  Sinatra all came for the heated saltwater pool, the wisteria-clad terrace and
  those sensational views.
