signatureExperiences:
  - name: The heated saltwater pool
    description: >-
      A heated saltwater pool surrounded by lush gardens and sensational views of
      the Italian Riviera, with bright orange umbrellas and a terracotta-and-azure
      colour palette. It was a magnet for celebrities in the 1950s and 60s and is
      the image most people picture when they think of old Hollywood glamour on the
      Ligurian coast.
  - name: La Terrazza restaurant
    description: >-
      The hotel's main restaurant, where you can eat fresh pasta while looking down
      at the yachts bobbing in the harbour below — one of the most romantic dining
      spots in the Mediterranean. It now serves a spaghetti dish called "Homage to
      Elizabeth Taylor."
  - name: The wisteria-clad terrace
    description: >-
      The terrace overlooking Portofino harbour where, it is rumoured, Richard
      Burton proposed to Elizabeth Taylor.
