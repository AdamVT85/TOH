priceRange: Rooms from around $2,000 per night in high season, breakfast included.
howToBook: >-
  Book direct at [belmond.com](https://www.belmond.com/hotels/europe/italy/portofino/belmond-hotel-splendido/) or by phone on +39 0185 267801.
  The hotel is seasonal and books up well in advance, so reserve early. If the
  Splendido is beyond reach, its harbourside sister hotel Splendido Mare offers
  more affordable rooms and shares some of the same Belmond polish.
nearestAirport: Genoa Cristoforo Colombo (GOA) — approx. 40 minutes by car
transportNotes: >-
  Perched on the hillside above Portofino harbour. The harbour piazzetta, which has
  barely changed since the 1950s, is a five-minute walk downhill from the hotel.
dressCode: ''
bestTimeToVisit: >-
  The hotel is open seasonally, roughly spring to early November. Late spring and
  early autumn are quieter than the high-summer crush.
accessibilityNotes: >-
  Contact the hotel directly to confirm accessible rooms and step-free access,
  particularly given the property's hillside setting.
tips: >-
  Order the "Homage to Elizabeth Taylor" spaghetti at La Terrazza and, if you are
  feeling indulgent, a chocolate martini (Liz's favourite drink) as you gaze out
  over the harbour. One thing to note: Portofino has introduced a selfie ban in
  certain areas, so you may need to admire the view with your actual eyes, like
  some kind of 1950s film star.
