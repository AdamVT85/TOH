sections:
  - copy: >-
      London's most famous hotel opened in 1889 and has, in the century and a
      half since, hosted virtually every major Hollywood star who crossed the
      Atlantic. Charlie Chaplin stayed here on his controversial return visits to
      England after his exile from America. Greta Garbo and Marlene Dietrich
      passed through. Frank Sinatra made it his London hotel of choice, and Ava
      Gardner dined at the Savoy Grill during her London years.

      It is the kind of place where the guest book reads like a roll call of the
      twentieth century — and where, mercifully, the staff have always known how
      to keep a secret.
  - heading: Marilyn, in a dress to remember
    copy: >-
      In 1956, Marilyn Monroe held a press conference at the Savoy during the
      filming of The Prince and the Showgirl with Laurence Olivier. By the most
      reliable accounts she wore a dress so tight that the assembled journalists
      forgot every question they had prepared.

      It is a small, perfect anecdote of a hotel that has spent more than a
      century playing host to people who turned simply arriving into an event.
    callout: >-
      The reporters had their questions ready. Then Marilyn walked in, and not
      one of them could remember a single one.
  - heading: The oldest cocktail bar in the world
    copy: >-
      The American Bar, which opened in the 1890s, claims to be the oldest
      surviving cocktail bar in the world. Its head bartenders have included some
      of the most influential mixologists in history, and the Art Deco interior
      is a masterclass in how a bar should look and feel.

      Frank Sinatra rated the Savoy thoroughly worth a visit even if you only
      came for a drink at the American Bar. Ava Gardner, who stayed here in 1956
      while working with a speech coach for her role in Bhowani Junction, would
      no doubt have approved of raising a glass in her memory.
