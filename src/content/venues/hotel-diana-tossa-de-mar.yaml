tips: >-
  The beachfront restaurant, La Terraza del Diana, looks out over the same bay
  Gardner and Mason filmed on. While in town, don't miss the Ava Gardner statue
  in the main square, and ask the local baker for a "besos de Ava Gardner" (Ava
  Gardner's kisses) to nibble on. The medieval walled town, the Vila Vella, that
  crowns the headland above the beach is still there and still recognisable from
  the film.
