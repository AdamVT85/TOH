sections:
  - heading: Where Ava fell in love with Spain
    copy: >-
      Tossa de Mar on the Costa Brava is where Ava Gardner fell in love with
      Spain. She stayed here in 1950 while filming the hauntingly romantic
      Pandora and the Flying Dutchman, with James Mason as her ghostly lover. It
      was the first of her many films set in the country, and it sparked a
      lifelong attachment that would eventually draw her to live in Madrid.

      The Hotel Diana, on the Plaza de Espana, is where Frank Sinatra came to
      visit Ava on set, and the two stayed here together during one of the more
      tempestuous chapters of their relationship. More than seventy years later
      it is still a delightfully romantic boutique hotel, right on the beach.
    callout: >-
      Sinatra flew in to visit Ava on set, and the two stayed here together
      during one of the more tempestuous chapters of their relationship.
  - heading: A modernist boutique on the beach
    copy: >-
      This family-run modernist boutique is as different from a grand city hotel
      as a place can be, and that is entirely the point. Built by a disciple of
      Gaudi over a century ago, the Diana sits directly on the beach in the
      medieval town, with sea-view rooms, balconies, and direct beach access.

      The beachfront restaurant, La Terraza del Diana, has sea views that
      haven't changed since Gardner and James Mason were filming on the beach
      below. Ranked number one in Tossa de Mar on Tripadvisor, it is the kind of
      place where you half expect Ava to walk through the door in a white
      sundress and ruin everyone's afternoon.
