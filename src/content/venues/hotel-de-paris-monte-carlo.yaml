sections:
  - copy: >-
      The Casino de Monte-Carlo is the belle epoque masterpiece that features in
      To Catch a Thief, where Cary Grant and Grace Kelly attend the gambling
      scenes filmed inside its ornate halls. Kelly herself would later live just
      up the hill as Princess Grace of Monaco after her marriage to Prince
      Rainier III in 1956.

      The Casino and the adjacent Hôtel de Paris, which has been the default
      address for visiting royalty, billionaires and film stars since the
      1860s, together form the centrepiece of Monaco's absurdly glamorous image.
  - heading: Sinatra on the Riviera
    copy: >-
      Every year, Frank Sinatra would visit his old friend Grace Kelly in the
      South of France for her annual Red Cross Ball. When he was in town, he
      stayed at the Hôtel de Paris — one of the grandest hotels on the Riviera
      and still a suitably lavish place to lay your head.

      It was on these visits to Monaco that the worlds of Old Hollywood and
      European royalty overlapped most completely, with the hotel as the natural
      meeting point.
    callout: Rooms from around €500 per night.
  - heading: A grande dame, recently revived
    copy: >-
      The Hôtel de Paris was recently renovated to the tune of several hundred
      million euros and now includes a rooftop pool and spa. The Casino itself
      is open to the public — over-18s, with the dress code enforced — and the
      interior, all gilt mirrors and frescoed ceilings, is worth the entry fee
      alone even if you have no intention of gambling. Which, given Monaco's
      prices, might be the prudent choice.
