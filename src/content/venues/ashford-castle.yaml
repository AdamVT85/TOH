sections:
  - heading: The Quiet Man filming base
    copy: >-
      Ashford Castle became world-famous after John Ford filmed The Quiet Man in
      the neighbouring village of Cong in 1952. John Wayne, Maureen O'Hara, and
      the crew stayed at the castle during filming, and the estate has been
      trading on the association ever since. The lush Irish landscapes of Ford's
      masterpiece have been inspiring movie fans to visit the Emerald Isle for
      eight decades — and the film duly picked up an Oscar for Best Colour
      Cinematography.

      Cong and Ashford Castle have become a pilgrimage site for John Wayne fans,
      and the estate is now one of Ireland's finest hotels.
    callout: A pilgrimage site for John Wayne fans for eight decades.
  - heading: An 800-year-old estate
    copy: >-
      A vast 800-year-old castle on the shores of Lough Corrib, Ashford has been
      turned into a five-star luxury hotel that has won the World's Best Hotel
      award multiple times. Alongside its George V dining room, the estate offers
      falconry, archery, a cinema, and a wine cellar.

      Cong itself is now an affluent town, tiny and walkable, with Quiet Man
      filming locations signposted throughout. Don't miss Pat Cohan's Pub, which
      doubled for the pub in the film and offers traditional Irish dishes with a
      twist alongside lots of Quiet Man memorabilia to gaze at while you eat.
