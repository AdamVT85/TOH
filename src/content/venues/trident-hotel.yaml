sections:
  - copy: >-
      The Trident Hotel sits on a low cliff just along the coast from Navy
      Island, in the part of Port Antonio that Errol Flynn made famous simply
      by living there through the 1950s. The hotel was not Flynn's own
      property — that distinction belongs to Navy Island itself, and to the
      Titchfield Hotel he bought intending to restore, both now closed or
      gone — but it opened during the same years he was based in the area,
      and has traded on that association ever since.
  - heading: A Quieter Side of the Island
    copy: >-
      Where the Ocho Rios stretch of Jamaica's north coast became known for
      its grand hotels and jet-set guest lists, Port Antonio kept something
      rougher and quieter — closer to the Jamaica Flynn actually discovered
      than the one most visitors picture. The Trident remains one of the few
      ways to stay on that same stretch of coast today.
