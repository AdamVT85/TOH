sections:
  - heading: A wedding in the presence of elephants
    copy: >-
      On 10 October 1975, sixteen months after their divorce, Elizabeth Taylor
      married Richard Burton for the second time. The ceremony took place at the
      Chobe Game Lodge in the village of Kasane, on the banks of the Chobe River
      in northern Botswana. It was conducted by the local African district
      commissioner, Ambrose Masalila, and witnessed by two lodge employees: the
      manager and a tour guide.

      News of the marriage didn't surface for five days. It lasted nine months —
      which is still longer than most safari holidays.
    callout: >-
      The most romantic, and most remote, address Taylor and Burton ever chose
      to say "I do."
  - heading: The first five-star lodge in Botswana
    copy: >-
      The Chobe Game Lodge was the first five-star safari lodge in Botswana and
      remains the only lodge built inside the Chobe National Park. It has a
      Moorish design, with tiled floors, towering arches, and Moroccan-style
      lanterns.

      All rooms and suites offer private terraces with river views, and the
      honeymoon suite has its own infinity plunge pool — which seems appropriate
      given the circumstances of its most famous wedding. The lodge now operates
      with electric safari vehicles and has Botswana's first all-female guiding
      team, a detail that Taylor, who spent her later years championing women's
      causes, would have loved. All meals and drinks are included.
  - heading: One of the densest concentrations of wildlife in Africa
    copy: >-
      The Chobe River frontage is home to one of the densest concentrations of
      wildlife in Africa. Elephants, hippos, buffalo, and crocodiles are regular
      visitors to the waterfront.

      If you want to remarry your ex-spouse in the presence of elephants and a
      district commissioner, this is the place to do it.
