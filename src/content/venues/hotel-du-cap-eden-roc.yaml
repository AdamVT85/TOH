signatureExperiences:
  - name: The Eden-Roc saltwater pool
    description: >-
      A saltwater pool chiselled directly out of the clifftop rock, filled with
      purified seawater drawn straight from the Mediterranean below. Its origins
      are unexpectedly romantic: when the First World War turned the Grand Hôtel
      du Cap into a convalescence centre for the American Red Cross, it was the
      nurses seeking relief from the heat who inspired carving a safe, elegant
      bathing pool into the rock. Open to hotel guests only, mid-April to
      mid-October, 8am to 7pm.
    availability: Hotel guests only; mid-April to mid-October, 8am–7pm
  - name: The Eden-Roc restaurant
    description: >-
      Perched on the rocks at the water's edge, this is one of the most
      spectacular dining settings in France. During Cannes, deals worth hundreds
      of millions are closed over lunch on its terrace.
  - name: The Eden-Roc Splash at the pool bar
    description: >-
      Dry off at the pool bar and order an Eden-Roc Splash, a Riviera classic
      from 1934, made with cognac, raspberry, lemon and champagne.
