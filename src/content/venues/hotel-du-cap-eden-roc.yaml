transportNotes: >-
  Set on a wooded headland at the tip of Cap d'Antibes, between Cannes and Nice.
  Reached most easily by car; the hotel is seasonal and somewhat secluded on its
  private peninsula.
bestTimeToVisit: >-
  Open seasonally from April to October. May brings the Cannes Film Festival and
  the most star-studded crowd; the quieter shoulder months are calmer and a
  little less astronomically priced.
accessibilityNotes: Contact the hotel directly to confirm access requirements.
tips: >-
  The hotel famously takes cash or bank transfer only, a policy unchanged since
  the golden age, so don't arrive expecting to tap a card. The pool is reserved
  for hotel guests. Every May the hotel hosts the amfAR Cinema Against AIDS
  charity auction, one of the most star-studded evenings on the Riviera calendar.
