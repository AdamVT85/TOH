sections:
  - copy: >-
      Built by William Randolph Hearst in 1926 as a place for his Hollywood
      friends to stay when visiting New York, the Warwick on West 54th Street
      has a guest list that reads like a casting call for the 20th century. It
      stands across from where the Ziegfeld Theatre once stood, a few blocks
      from Central Park and the Museum of Modern Art.

      The Beatles stayed during their first American tour. Elvis checked in.
      James Dean brooded in the lobby. Over its century in business the hotel
      has also hosted Elizabeth Taylor, and it remains a working hotel where you
      can still book a room tonight.
  - heading: The essential Cary Grant hotel in New York
    copy: >-
      Cary Grant lived here for twelve years while he was working in New York,
      occupying the Suite of the Stars on the 27th floor — a 1,200-square-foot
      apartment with a four-poster king bed, whirlpool tub, sauna, and a large
      wrap-around terrace with sweeping views of Manhattan. The suite is still
      available to book today, now also known as the Cary Grant Suite.

      In a typically generous gesture, Grant lent the suite to his friend Roger
      Moore (a fellow director of the Fabergé cosmetics company) and Moore's
      wife Luisa while they were in New York filming Live and Let Die. On their
      first night in the apartment, Moore and his wife watched an old Randolph
      Scott western on television, which — given Grant's long history with Scott
      — must have amused everybody involved.
    callout: >-
      On Roger Moore's first night in Grant's suite, decades later, Moore chose
      to watch a Randolph Scott western. Draw your own conclusions.
  - heading: A building-sized love letter to old Hollywood
    copy: >-
      The Warwick is more than the Cary Grant connection. The hotel also has
      suites named after Hearst, Marion Davies, Jane Russell, and the Ziegfeld
      Follies, each designed to reflect the style and tastes of its namesake.

      For anyone tracing the Hearst Castle story across the country, the Hearst
      Suite and Marion Davies Suite make this Midtown hotel an unexpected coda
      to a visit to San Simeon — proof that Hearst built places for his
      Hollywood circle on both coasts.
