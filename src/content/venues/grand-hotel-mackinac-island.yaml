signatureExperiences:
  - name: Esther Williams Pool
    description: >-
      The hotel's serpentine main pool, originally built in the 1920s and once
      known as "Paul Bunyan's Footprint," renamed after champion
      swimmer-turned-actress Esther Williams, whose 1947 film This Time for Keeps
      was shot partly here. It runs 220 feet long and received a $10 million
      renovation in 2021 for its centennial. The main pool is kept at a very
      pleasant 83°F. There are cabanas, a pool bar, a water slide, and a
      zero-depth beach entry area for families.
    availability: Hotel guests only; open seasonally
  - name: Adults-only infinity pool
    description: >-
      A heated infinity pool with views across the Straits to Michigan's Upper
      Peninsula, kept at 92°F.
    availability: Hotel guests only; open seasonally
  - name: The world's longest porch
    description: >-
      The Grand Hotel's famous front porch runs 660 feet — the longest in the
      world. Non-guests can walk it for a $12 fee, which gives you the views if
      not the swim.
    price: $12 for non-guests
