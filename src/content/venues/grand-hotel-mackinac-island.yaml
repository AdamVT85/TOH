howToBook: >-
  Book direct at [grandhotel.com](https://www.grandhotel.com/) or by phone. The hotel is open seasonally
  and is reached by ferry — no cars on the island. Non-guests can walk the famous
  660-foot porch for a $12 fee.
nearestAirport: >-
  Pellston Regional Airport (PLN) on the mainland, then ferry from Mackinaw City
  or St. Ignace — the airport is roughly 20 minutes by road from the ferry docks,
  with a 16–26 minute crossing to the island.
transportNotes: >-
  The island is car-free, reachable only by ferry and served exclusively by
  horse-drawn carriages and bicycles. Ferries run from Mackinaw City and St.
  Ignace during the season.
dressCode: A dinner jacket is required in the Main Dining Room after 6pm.
bestTimeToVisit: >-
  The hotel is open seasonally, roughly late spring through autumn. The 2026
  season is its 140th.
accessibilityNotes: >-
  Contact the hotel directly to confirm access requirements, particularly given
  the island's car-free setting.
tips: >-
  The pool is for hotel guests only. If you are not staying, you can still walk
  the hotel's famous 660-foot porch — the longest in the world — for a $12 fee,
  which gives you the views if not the swim. Note the 19.5% resort fee on top of
  room rates, and the dinner-jacket rule in the Main Dining Room after 6pm.
