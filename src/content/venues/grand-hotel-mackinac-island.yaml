sections:
  - heading: The world's largest wooden hotel
    copy: >-
      On a car-free island in the Straits of Mackinac, reachable only by ferry
      and served exclusively by horse-drawn carriages and bicycles, sits the
      world's largest wooden hotel and one of the most wonderfully eccentric
      pools in classic Hollywood history.

      The Grand Hotel's pool was originally built in the 1920s and was known,
      brilliantly, as "Paul Bunyan's Footprint" — because an identical pool had
      been built in Traverse City, and local legend held that when Bunyan walked
      north he left one footprint in each town.
    callout: A hotel where the nearest car is on the mainland.
  - heading: Esther Williams and the flannel swimsuit
    copy: >-
      The pool was renamed after Esther Williams, the champion
      swimmer-turned-Hollywood actress, whose 1947 film This Time for Keeps was
      shot partly on location here. The film — a romantic comedy co-starring
      Jimmy Durante and Xavier Cugat's band, a casting combination that could
      only have happened in 1940s Hollywood — was one of Williams' string of MGM
      "aquamusicals" and put the Grand Hotel back on the road to profitability in
      the lean years after the war. After the film's release, the hotel enjoyed
      its best-ever occupancy.

      Williams wore specially designed lumberjack-pattern swimsuits for the film,
      which, in a decision that speaks volumes about the priorities of a wardrobe
      department over a swimming department, were made of flannel. She later
      wrote in her autobiography that she could barely keep her head above water
      in the heavy fabric and eventually had to shed the suit in the pool. The
      hotel named a room in her honour, and she used it for the rest of her life
      — she died in 2013.
  - heading: Somewhere in Time
    copy: >-
      The pool is 220 feet long, serpentine-shaped, and received a $10 million
      renovation in 2021 for its centennial. It's now joined by a heated
      adults-only infinity pool with views across the Straits to Michigan's Upper
      Peninsula.

      Film fans will also know the Grand Hotel as the setting for Somewhere in
      Time, the 1980 Christopher Reeve and Jane Seymour romance that has its own
      devoted following and an annual fan weekend at the hotel.
