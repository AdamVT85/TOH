signatureExperiences:
  - name: The Neptune Pool
    description: >-
      Julia Morgan's outdoor masterpiece: 104 feet long, 58 feet wide, holding
      345,000 gallons of spring water piped from the Santa Lucia Mountains and
      lined with Vermont marble. Its centrepiece is the facade of an actual
      Ancient Roman temple Hearst bought in Europe and shipped across the
      Atlantic. Hearst had it built, torn down, and rebuilt three times between
      1924 and 1936, each version bigger than the last.
  - name: The Roman Pool
    description: >-
      The indoor pool, its walls and ceiling covered in mosaics of gold and
      blue glass tile. Together with the Neptune Pool it was where Douglas
      Fairbanks Jr. played water polo and Tarzan star Johnny Weissmuller
      worked out.
  - name: Hearst and Hollywood Tour
    description: >-
      A guided tour focused specifically on the castle's celebrity connections
      — the one for readers of this website.
    price: $35 adults, $20 children
  - name: Foundation pool swim events
    description: >-
      The Foundation at Hearst Castle runs a handful of exclusive evening swim
      events each year in the Neptune or Roman Pool, with a scenic ride up the
      hill, use of the historic dressing rooms, catering and wine. Only about
      50 guests per event, and they sell out instantly.
    price: Foundation membership (~$500/year) plus a ~$1,000 swim reservation
    availability: A few rare events per year; check the Hearst Castle website
website: https://hearstcastle.org/
phone: +1 800-444-4445
openingHours: >-
  Open to visitors by guided tour only. Tours depart from the Visitor Centre at
  the base of the hill. Check hearstcastle.org for current days and times.
priceRange: Most guided tours $35 adults, $20 children; specialist tours from $100 per person
howToBook: >-
  All visits are by guided tour only. Reserve up to 60 days ahead at [ReserveCalifornia.com](https://www.reservecalifornia.com) or by calling 1-800-444-4445; tours
  sell out in summer. See [hearstcastle.org](https://hearstcastle.org/) for tour options and pool-swim event
  announcements.
nearestAirport: San Luis Obispo County Regional Airport (SBP) — approx. 1 hour by car; Hearst Castle sits on Highway 1, roughly halfway between San Francisco and Los Angeles
transportNotes: >-
  Hearst Castle is on Highway 1 near San Simeon. The drive along Highway 1,
  particularly the stretch from Cambria through Big Sur, is one of the most
  spectacular coastal drives in the world and is worth the trip in its own
  right. A shuttle bus carries visitors from the Visitor Centre up to the
  castle.
bestTimeToVisit: >-
  Book ahead for summer, when tours sell out. The hilltop can be cool even when
  the coast is warm, so bring layers.
accessibilityNotes: >-
  The Grand Rooms Tour has the fewest stairs; other tours involve a good deal
  of walking and stair-climbing. Contact the venue directly to confirm access
  requirements.
tips: >-
  Wear comfortable shoes — there is a lot of walking and stair-climbing. Bring
  layers, as the hilltop can be cool even when the coast below is warm. The only
  food for purchase is at the Visitor Centre, so eat before or after your tour.
  Tours are in English only. Watch Citizen Kane before you visit — the echoes
  are everywhere. Look out for the wild zebras, descendants of Hearst's private
  zoo, grazing alongside the cattle as you drive up Highway 1.
