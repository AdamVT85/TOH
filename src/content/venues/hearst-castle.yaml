excerpt: >-
  William Randolph Hearst's "Enchanted Hill" above San Simeon, where for three
  decades an invitation was the most coveted ticket in Hollywood. Julia Morgan
  built it; Marion Davies hosted it; Cary Grant, Chaplin, Gable and a private
  zoo full of lions filled it. Now a California state monument open by guided
  tour.
pullQuote: >-
  A visit to the Hearst ranch was a ticket to Never Land. Never has there been
  such a place, and never will there be again.
pullQuoteAttribution: Hedda Hopper
