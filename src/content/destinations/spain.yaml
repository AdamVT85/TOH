excerpt: >-
  This is the country that bewitched Ava Gardner so completely she abandoned
  Hollywood to live there. Flamenco, bullfighters, Technicolor melodrama and a
  fascist regime's improbable tourism gamble — here is Spain as the stars knew
  it, from the Costa Brava to the tablaos of Madrid.
