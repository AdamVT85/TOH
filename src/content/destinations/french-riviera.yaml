excerpt: >-
  From Cary Grant and Grace Kelly in To Catch a Thief to F. Scott Fitzgerald at
  the Hôtel du Cap, the coast between Cannes and the Italian border has been
  Hollywood's summer playground for a century. Here's how to travel it in the
  footsteps of the stars.
