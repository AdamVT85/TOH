excerpt: >-
  From Ava Gardner's quiet Knightsbridge years to Elizabeth Taylor and Richard
  Burton's Van Gogh-on-the-wall theatrics at the Dorchester, London was the
  English capital that Old Hollywood passed through, performed in, and sometimes
  retired to. Here's how to travel it in the footsteps of the stars.
