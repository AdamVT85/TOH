sections:
  - heading: ""
    copy: "The French Riviera and Hollywood discovered each other in the 1920s and have never quite let go. Long before it became a package-holiday coastline, the Cote d'Azur was the exclusive summer playground of film royalty — a place where the industry's biggest names could escape the pressures of the studio system and reinvent themselves against a backdrop of Mediterranean blue. The connection runs so deep that the Riviera eventually produced its own Hollywood fairy tale: a movie star who became an actual princess."
    callout: ""
  - heading: "Grace Kelly's Coastline"
    copy: "Grace Kelly first visited the Riviera in 1955 to attend the Cannes Film Festival, where a publicity meeting with Prince Rainier III of Monaco set in motion one of the twentieth century's most famous romances. Within a year she had retired from acting and become Her Serene Highness Princess Grace of Monaco, transforming the tiny principality into a destination that blurred the line between European aristocracy and American glamour. Today, visitors can tour the Prince's Palace where she lived, visit the cathedral where she married and where she is now buried, and walk the same corniche roads that Alfred Hitchcock used as a backdrop in To Catch a Thief — the very film that first brought Kelly to these shores."
    callout: ""
  - heading: "Cannes: Where Cinema Meets the Sea"
    copy: |-
      Cannes itself remains the spiritual capital of the film industry's relationship with the Riviera. The Festival de Cannes, held every May since 1946, draws the global film world to the Palais des Festivals on the Croisette, and the town's grand hotels — the Carlton, the Majestic, the Martinez — have hosted every major star from Brigitte Bardot to Brad Pitt. Outside of festival season, Cannes is quieter but no less cinematic. Walk the Croisette at sunset, dine at a seafood restaurant in Le Suquet, and understand why generations of filmmakers have treated this coast as a second home.

      Beyond Monaco and Cannes, the Riviera offers a constellation of Old Hollywood landmarks. The Hotel du Cap-Eden-Roc in Antibes, clinging to its rocky promontory, was the model for the hotel in F. Scott Fitzgerald's Tender Is the Night and has been a favourite of American film stars since the silent era. The hilltop village of Saint-Paul-de-Vence drew artists and actors alike — Yves Montand and Simone Signoret were married at the Colombe d'Or inn, whose walls are hung with original Picassos and Miroes given as payment by artist patrons. From Nice to Menton, the Riviera is layered with Hollywood history, and the best way to experience it is slowly: by train, by convertible, or on foot along the coastal paths, letting the light and the landscape explain why the movies fell in love with this place and never fell out.
    callout: ""
